name: Run tests

run-name: ${{ inputs.orchestrator_run_suffix && format('Run tests - {0}', inputs.orchestrator_run_suffix) || github.workflow }}

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      enterprise_version:
        description: Specmatic enterprise version under test
        required: false
        type: string
      enterprise_artifact_url:
        description: Specmatic enterprise jar/artifact URL under test
        required: false
        type: string
      orchestrator_run_suffix:
        description: Test Orchestrator run suffix
        required: false
        type: string
  repository_dispatch:
    types: contracts changed
jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        java: [ 17 ]
    runs-on: ${{ matrix.os }}
    env:
      ENTERPRISE_VERSION: ${{ inputs.enterprise_version }}
      ENTERPRISE_ARTIFACT_URL: ${{ inputs.enterprise_artifact_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}


      - name: Setup Maven Action
        uses: s4u/setup-maven-action@v1.19.0
        with:
          checkout-enabled: false

      # Internal setup required by Specmatic. Sample project users can ignore this block.
      - if: ${{ inputs.orchestrator_run_suffix != '' }}
        uses: specmatic/specmatic-github-workflows/action-orchestrator-setup@main
        with:
          orchestrator-run-suffix: ${{ inputs.orchestrator_run_suffix }}
          docker-hub-username: ${{ vars.SPECMATIC_DOCKER_HUB_USERNAME }}
          docker-hub-token: ${{ secrets.SPECMATIC_DOCKER_HUB_TOKEN }}
      # End: internal setup required by Specmatic.

      - name: Download Specmatic CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.specmatic

          if [ -n "${ENTERPRISE_ARTIFACT_URL:-}" ]; then
            url="${ENTERPRISE_ARTIFACT_URL}"
            output_path="$HOME/.specmatic/specmatic.jar"
            echo "Downloading Specmatic Enterprise artifact"
            echo "$url"

            initial_sleep=$(( RANDOM % 31 ))
            echo "Initial jitter: ${initial_sleep}s"
            sleep "$initial_sleep"

            echo "Download attempt 1/1"
            curl --http1.1 -L --fail --continue-at - "$url" -o "$output_path"
            echo "Enterprise artifact downloaded successfully"
          else
            echo "Downloading latest specmatic.jar from GitHub releases"
            curl -L -f -o ~/.specmatic/specmatic.jar https://github.com/specmatic/specmatic/releases/latest/download/specmatic.jar
          fi

      - name: Save Specmatic license
        if: ${{ github.ref == 'refs/heads/main' || inputs.enterprise_artifact_url != '' }}
        run: |
          mkdir -p ~/.specmatic
          echo "${{ secrets.SPECMATIC_LICENSE_KEY }}" > ~/.specmatic/specmatic-license.txt

      - name: Build with Maven
        run: ./mvnw --no-transfer-progress test package jacoco:report -Ptest

      - name: Publish Build Reports to Specmatic Insights
        if: ${{ github.ref == 'refs/heads/main' && inputs.orchestrator_run_suffix == '' }}
        run: |
          docker run \
            --rm \
            -e GIT_DISCOVERY_ACROSS_FILESYSTEM=1 \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/usr/src/app \
            -v "${HOME}/.specmatic:/root/.specmatic:ro" \
            -v "${{ github.workspace }}:/usr/src/app" \
            -w /usr/src/app \
            specmatic/specmatic \
            send-report \
            --metadata build_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} \
            --branch-name ${{ github.ref_name }} \
            --repo-name ${{ github.event.repository.name }} \
            --repo-id ${{ github.repository_id }} \
            --repo-url ${{ github.event.repository.html_url }}


      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: jacoco coverage report
          path: /home/runner/work/specmatic-order-api/specmatic-order-api/target/site/jacoco

      - name: Upload HTML Test Report
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.os }}-${{ matrix.java }}-html-report
          path: build/reports/specmatic/test/html

      - name: Upload CTRF Test Report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ctrf-report
          path: build/reports/specmatic/test/ctrf/*.json
          retention-days: 5

      - name: Upload target jar for Docker
        uses: actions/upload-artifact@v6
        with:
          name: jar
          path: target/*.jar

  docker:
    if: ${{ github.ref == 'refs/heads/main' && inputs.orchestrator_run_suffix == '' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download target jar from build job
        uses: actions/download-artifact@v7
        with:
          name: jar
          path: target/
      - name: List files in target directory
        run: ls -la target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        run: echo ${{ secrets.SPECMATIC_DEMO_DOCKER_HUB_TOKEN }} | docker login -u ${{ vars.SPECMATIC_DEMO_DOCKER_HUB_USERNAME }} --password-stdin

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: specmaticdemo/${{ github.event.repository.name }}

      - name: Build and push Docker image (multi-platform)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            specmaticdemo/${{ github.event.repository.name }}:latest
          labels: ${{ steps.meta.outputs.labels }}
